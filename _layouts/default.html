<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <style>
    :root { --bg:#ffffff; --fg:#1f2328; --muted:#59636e; --border:#d1d9e0; --code-bg:#f6f8fa; --link:#0969da; --accent:#2563eb; --quote:#eef4ff; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --border:#30363d; --code-bg:#161b22; --link:#4493f8; --accent:#4493f8; --quote:#132036; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:17px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
    main { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
    nav.top { font-size:15px; margin-bottom:16px; }
    a { color:var(--link); text-decoration:none; } a:hover { text-decoration:underline; }
    h1 { font-size:2rem; line-height:1.25; margin:.4em 0 .6em; }
    h2 { font-size:1.5rem; margin-top:2.2em; padding-bottom:.3em; border-bottom:1px solid var(--border); }
    h3 { font-size:1.2rem; margin-top:1.6em; }
    p, li { overflow-wrap:anywhere; }
    pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:14px 16px; overflow-x:auto; font-size:14px; line-height:1.5; }
    code { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em; }
    :not(pre) > code { background:var(--code-bg); padding:.15em .35em; border-radius:4px; }
    table { border-collapse:collapse; width:100%; display:block; overflow-x:auto; font-size:15px; margin:1em 0; }
    th, td { border:1px solid var(--border); padding:6px 10px; text-align:left; vertical-align:top; }
    th { background:var(--code-bg); }
    blockquote { margin:1em 0; padding:.6em 1em; background:var(--quote); border-left:4px solid var(--accent); border-radius:4px; }
    .mermaid { margin:1.2em 0; text-align:center; overflow-x:auto; }
    .task-list-item { list-style:none; } .task-list-item input { margin-right:.4em; }
    footer { margin-top:60px; color:var(--muted); font-size:14px; border-top:1px solid var(--border); padding-top:12px; }
  </style>
</head>
<body>
  <main>
    <nav class="top"><a href="{{ '/' | relative_url }}">← All days</a></nav>
    {% if page.title %}<h1>{{ page.title }}</h1>{% endif %}
    {{ content }}
    <footer>{{ site.title }}</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script>
    document.querySelectorAll('pre > code.language-mermaid').forEach(function (code) {
      var pre = code.parentElement;
      var host = pre.parentElement && pre.parentElement.classList.contains('highlight') ? pre.parentElement.parentElement || pre.parentElement : pre;
      var div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      host.replaceWith(div);
    });
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    mermaid.initialize({ startOnLoad: false, theme: dark ? 'dark' : 'default', securityLevel: 'strict' });
    mermaid.run({ querySelector: '.mermaid' });
  </script>
</body>
</html>
